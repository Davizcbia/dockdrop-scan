<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DockDrop · 添加设备</title>
<link rel="stylesheet" href="../style.css">
<style>
  html, body { background: radial-gradient(circle at 50% 38%, #0d1626, #05070d 70%); overflow: auto; }
  main { min-height: 100%; display: grid; place-items: center; padding: 28px 16px; }
  .stage { display: flex; gap: 40px; align-items: center; flex-wrap: wrap; justify-content: center; }
  @media (max-width: 720px) { main { align-items: start; } }
  .bubble-wrap { position: relative; width: min(62vmin, 560px); aspect-ratio: 1; }
  #bubble { width: 100%; height: 100%; display: block; }
  .confirmation { position: absolute; inset: 12%; display: grid; place-items: center; border-radius: 50%; opacity: 0;
    background: radial-gradient(ellipse at 66% 80%, #539eb244, transparent 55%),
      radial-gradient(ellipse at 31% 22%, #88b5d95c, transparent 37%),
      radial-gradient(circle at 45% 40%, #293d56, #101d30 72%, #496578 100%);
    box-shadow: inset 0 1px 3px #d4f1ff99, inset 0 -3px 12px #72b9dc45, 0 16px 48px #0007;
    pointer-events: none; }
  .confirmation svg { width: 30%; height: 30%; }
  .confirmation path { fill: none; stroke: #edfaff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 1; stroke-dashoffset: 1; }
  .ripple { position: absolute; inset: 10%; border-radius: 50%; opacity: 0; pointer-events: none;
    box-shadow: inset 0 0 3px 2px #d6f4ff, 0 0 14px 3px #8dd8ff66; }
  .done #bubble { opacity: 0; animation: clear-code .48s ease-out; }
  .done .confirmation { opacity: 1; animation: reveal-glass .52s cubic-bezier(.22,.7,.24,1) both; }
  .done .ripple { animation: travel .60s cubic-bezier(.2,.55,.3,1) both; }
  .done .confirmation path { animation: draw-check .29s .25s ease-out both; }
  @keyframes clear-code { from { opacity: 1; } to { opacity: 0; } }
  @keyframes reveal-glass { from { opacity: .1; clip-path: circle(0%); } to { opacity: 1; clip-path: circle(50%); } }
  @keyframes travel {
    0% { opacity: 0; transform: scale(.04); }
    21% { opacity: .78; }
    100% { opacity: 0; transform: scale(1.04); }
  }
  @keyframes draw-check { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .done #bubble, .done .confirmation, .done .ripple, .done .confirmation path { animation: none; }
    .done .confirmation path { stroke-dashoffset: 0; }
  }
  .side { width: 280px; padding: 20px; }
  .side h1 { font-size: 20px; margin: 0 0 6px; font-weight: 600; letter-spacing: -0.015em; }
  .side p { font-size: 13px; color: rgba(255,255,255,0.75); margin: 0 0 12px; }
  #qr { width: 148px; height: 148px; image-rendering: pixelated; border-radius: 10px; display: block; margin: 6px 0 8px; }
  #log { font-size: 13px; min-height: 2.8em; }
  .meta { font: 12px ui-monospace, Consolas, monospace; color: rgba(255,255,255,0.55); margin-top: 10px; white-space: pre-line; }
  .bar { height: 3px; border-radius: 2px; background: rgba(255,255,255,0.12); overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; background: #6fb0ff; width: 100%; transition: width 1s linear; }
</style>
</head>
<body>
<main>
  <div class="stage">
    <div class="bubble-wrap" id="wrap">
      <canvas id="bubble"></canvas>
      <div class="confirmation" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M10 25l9 9 19-20" pathLength="1"/></svg></div>
      <div class="ripple" aria-hidden="true"></div>
    </div>
    <div class="side glass">
      <h1>添加设备</h1>
      <div id="guide">
        <p>用手机打开扫描页，对准电脑上的光泡。</p>
        <p>扫不出来？用手机自带相机扫这个二维码：</p>
        <canvas id="qr" aria-label="备用二维码"></canvas>
        <div class="bar"><i id="bar"></i></div>
        <div class="meta" id="meta"></div>
      </div>
      <div id="log" role="status">正在准备…</div>
      <button class="button" id="next" hidden>再添加一台设备</button>
    </div>
  </div>
</main>
<script type="module">
  import { SIGNAL_URL } from '../config.js';
  import { pair } from '../pair.js';
  import { encode, render } from './bubble-code.js';
  import { qrEncode, drawQR } from './qr.js';

  const q = new URLSearchParams(location.search);
  const signal = q.get('signal') || SIGNAL_URL;
  const LIFETIME = 60;  // s: a code is only good this long (and only once)
  const $ = (id) => document.getElementById(id);
  const log = (t) => { $('log').textContent = t; };
  // the scanner page (same folder); local tests pass the relay on
  const scanUrl = q.get('scan') || new URL('./', location.href).href;

  let current = null, count = 0;
  function newSecret() {
    const b = crypto.getRandomValues(new Uint8Array(8));
    return Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('');
  }
  function drawBubble(secret) {
    const c = $('bubble');
    const css = c.offsetWidth, size = Math.round(css * (window.devicePixelRatio || 1));  // offsetWidth: not the shrink transform
    c.width = size; c.height = size;
    const t0 = performance.now();
    const rgba = render(encode({ version: 1, flags: 1, secret: BigInt('0x' + secret) }), size, { bg: [7, 10, 18] });
    // outside the dark quiet zone the page shows through (soft edge)
    const R = size * 0.38;
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const r = Math.hypot(x + 0.5 - size / 2, y + 0.5 - size / 2) / R;
      if (r > 1.18) rgba[(y * size + x) * 4 + 3] = Math.max(0, 255 * (1 - (r - 1.18) / 0.06));
    }
    c.getContext('2d').putImageData(new ImageData(rgba, size, size), 0, 0);
    return performance.now() - t0;
  }
  function drawFallback(secret) {
    let url = scanUrl + '#s=' + secret;
    if (q.get('signal')) url = scanUrl + '?signal=' + encodeURIComponent(q.get('signal')) + '#s=' + secret;
    const code = qrEncode(url);
    drawQR($('qr').getContext('2d'), code, 4, { fg: '#000', bg: '#fff' });
    return { url, code };
  }

  function showConnected(peerName) {
    $('wrap').classList.add('done');
    $('guide').hidden = true;
    log(`已连接：${peerName || '手机'}`);
    const next = $('next');
    next.hidden = false;
    return new Promise((resolve) => next.addEventListener('click', resolve, { once: true }));
  }

  // Refresh an expired code, or issue a new one when the user adds another device.
  async function cycle() {
    const secret = newSecret();
    const ctl = new AbortController();
    current = { secret };
    $('wrap').classList.remove('done');
    $('guide').hidden = false;
    $('next').hidden = true;
    document.title = 'DockDrop · 添加设备';
    const ms = drawBubble(secret);
    const fb = drawFallback(secret);
    $('meta').textContent = `code …${secret.slice(-4)} · 渲染 ${ms.toFixed(0)} ms\nQR v${fb.code.version} · ${fb.url.length} 字符\n已配对 ${count} 次`;
    const bar = $('bar'); bar.style.transition = 'none'; bar.style.width = '100%'; void bar.offsetWidth;
    bar.style.transition = `width ${LIFETIME}s linear`; bar.style.width = '0%';
    const expire = setTimeout(() => ctl.abort(), LIFETIME * 1000);
    if (!signal) { log('没配置配对服务：只测试扫描'); await new Promise((r) => setTimeout(r, LIFETIME * 1000)); return; }
    log('等待手机扫描…');
    try {
      const res = await pair({ signalUrl: signal, secret, role: 'host', name: 'DockOver 电脑', signal: ctl.signal,
                               onStatus: (t) => log(t), timeoutMs: LIFETIME * 1000 + 30000, peerWaitMs: 0 });
      clearTimeout(expire);
      count++;
      current = null;
      document.title = 'DockDrop · 已连接';
      window.dockdropLink = res;
      await showConnected(res.peerName);
    } catch (e) {
      clearTimeout(expire);
      if (e.message !== 'cancelled') { log('这次没连上（' + e.message + '），换一个新码'); await new Promise((r) => setTimeout(r, 1500)); }
    }
  }
  (async () => { for (;;) await cycle(); })();
  addEventListener('resize', () => { if (current) drawBubble(current.secret); });
  window.currentSecret = () => current && current.secret;  // tests
</script>
</body>
</html>
