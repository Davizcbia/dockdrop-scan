<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DockDrop 配对 · 光泡扫描</title>
<link rel="stylesheet" href="../style.css">
<style>
  .scan-control {
    corner-shape: round;
    color: #fff;
    background: linear-gradient(155deg, rgba(255,255,255,0.22), transparent 58%),
      rgba(19,25,36,0.34);
    -webkit-backdrop-filter: blur(16px) saturate(165%);
    backdrop-filter: blur(16px) saturate(165%);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.52),
      inset 0 -1px 2px rgba(255,255,255,0.24),
      inset 0 0 0 1px rgba(255,255,255,0.16), 0 6px 18px rgba(0,0,0,0.26);
  }
  .top.scan-control { border-radius: 999px; }
  .top.scan-control .sub { color: rgba(255,255,255,0.9); }
  .close.scan-control {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    top: calc(env(safe-area-inset-top) + 22px);
  }
  .close.scan-control:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .camera-glass { position: fixed; top: 0; left: 0; width: 100%; pointer-events: none; }
  .refraction-active .scan-control {
    background: linear-gradient(155deg, rgba(255,255,255,0.07), transparent 60%);
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
  @media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
    .scan-control {
      background: #202634;
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.6);
    }
  }
  .result-text .metrics { display: block; margin-top: 8px; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: rgba(255,255,255,0.6); white-space: pre-line; }
  #continuePair:not([hidden]) + #again { margin-top: 8px; }
  .transfer-mode {
    display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 4px; margin-bottom: 14px;
    border-radius: 16px; background: rgba(255,255,255,.07);
  }
  .transfer-mode button {
    min-height: 44px; border: 0; border-radius: 12px; background: transparent;
    color: inherit; font: inherit; font-weight: 600; cursor: pointer;
  }
  .transfer-mode button[aria-pressed="true"] { background: rgba(255,255,255,.15); box-shadow: 0 1px 3px #0004; }
  .transfer-mode button:focus-visible, .received a:focus-visible { outline: 2px solid #fff; }
  .transfer-fields[hidden], .received[hidden] { display: none; }
  .transfer-fields { display: grid; gap: 8px; margin: 0 0 16px; text-align: left; }
  .transfer-fields label { font-size: 13px; font-weight: 600; }
  .transfer-fields input, .transfer-fields textarea {
    min-width: 0; width: 100%; padding: 10px 12px; border-radius: 14px; color: inherit;
    border: 1px solid rgba(255,255,255,.20); background: rgba(255,255,255,.07); font: inherit;
  }
  .transfer-fields textarea { resize: vertical; max-height: 160px; font-size: 16px; }
  .transfer-fields input::file-selector-button {
    margin-inline-end: 8px; border: 0; border-radius: 9px; padding: 5px 8px;
    background: rgba(255,255,255,.16); color: inherit; font: inherit;
  }
  .received { max-height: min(38dvh, 280px); overflow: auto; margin-bottom: 12px; }
  .received a { color: inherit; display: block; padding: 10px 6px; text-align: left; overflow-wrap: anywhere; }
  .received textarea { width: 100%; padding: 10px; border-radius: 12px; background: #ffffff12; color: inherit; font: inherit; }
  .received .button { padding: 10px; margin: 6px 0; }
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<div class="focus" id="focus" aria-hidden="true" hidden><i></i><i></i><i></i><i></i></div>
<div class="vignette"></div>

<button class="close scan-control" id="close" aria-label="关闭相机" hidden><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
<header class="top scan-control">
  <div class="title">DockDrop</div>
  <div class="sub" id="hint">将光泡对准画面中央</div>
</header>

<div class="start glass sheet show" id="start">
  <div class="transfer-mode" role="group" aria-label="收发方向">
    <button type="button" id="modeSend" aria-pressed="true">发送到电脑</button>
    <button type="button" id="modeReceive" aria-pressed="false">从电脑接收</button>
  </div>
  <div class="start-text" id="startText">准备好内容，在电脑桌面或资源管理器右键选择 DockDrop，再扫描光泡。</div>
  <div class="transfer-fields" id="transferFields">
    <label for="sendFiles">文件</label>
    <input id="sendFiles" type="file" multiple>
    <label for="sendText">文字</label>
    <textarea id="sendText" rows="2" placeholder="输入或粘贴文字"></textarea>
  </div>
  <button id="go" class="button">打开相机</button>
</div>

<div class="result glass sheet" id="result" hidden>
  <div class="check" aria-hidden="true"><svg viewBox="0 0 52 52"><path d="M15 27 l8 8 l15 -17"/></svg></div>
  <div class="result-title" id="resultTitle">已连接</div>
  <div class="result-text" id="resultText"></div>
  <div class="received" id="received" hidden></div>
  <button id="continuePair" class="button" hidden>继续配对</button>
  <button id="again" class="button">返回收发</button>
</div>

<div class="status glass" id="status" hidden><span class="spinner" id="spinner"></span><span id="statusText"></span><button id="cancel" class="link" hidden>取消</button></div>
<script type="module" src="scan.js?v=transfer2"></script>
</body>
</html>
